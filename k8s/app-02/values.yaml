image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

# Recursos externalizados: os templates apenas referenciam estes valores,
# permitindo sobrescrever por ambiente com -f ou --set.
api:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
